<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>أبو ماجد</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --teal-900:#0B4F45;
    --teal-700:#136B5D;
    --gold:#C9982E;
    --gold-light:#E7CB84;
    --parchment:#F6F1E4;
    --paper:#FFFDF8;
    --ink:#26221D;
    --ink-soft:#6E6255;
    --line: rgba(38,34,29,.12);
    --shadow: 0 10px 30px -12px rgba(11,79,69,.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 50% -10%, #ffffff 0%, var(--parchment) 55%),
      var(--parchment);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    padding:20px 14px 60px;
  }
  @media (prefers-reduced-motion: reduce){ *{animation:none !important; transition:none !important;} }

  .wrap{max-width:760px; margin:0 auto;}

  .braid{
    height:10px; margin-bottom:24px;
    background-image:
      linear-gradient(45deg, var(--gold) 25%, transparent 25%),
      linear-gradient(-45deg, var(--gold) 25%, transparent 25%);
    background-size:14px 14px; opacity:.55; border-radius:6px;
  }

  header.top{ text-align:center; margin-bottom:34px; }
  header.top .badge{
    width:96px; height:96px; margin:0 auto 14px;
    border-radius:50%; overflow:hidden;
    box-shadow:var(--shadow); border:3px solid var(--gold-light);
  }
  header.top .badge img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  header.top h1{
    font-family:'Reem Kufi', sans-serif; font-size:34px; margin:0 0 6px;
    color:var(--teal-900);
  }
  header.top p{ margin:0; color:var(--ink-soft); font-size:14.5px; }

  .grid{ display:grid; grid-template-columns:1fr; gap:14px; }
  @media (min-width:520px){ .grid{ grid-template-columns:1fr 1fr; } }

  .tool-card{
    display:block; text-decoration:none; color:inherit;
    background:var(--paper); border:1px solid var(--line);
    border-radius:20px; padding:22px 20px;
    box-shadow:var(--shadow);
    position:relative; overflow:hidden;
  }
  .tool-card::before{
    content:""; position:absolute; top:0; right:0; width:70px; height:70px;
    background:var(--gold-light); opacity:.25; border-radius:0 0 0 70px;
  }
  .tool-card .icon{
    width:auto; min-width:46px; height:46px; border-radius:14px; background:var(--teal-900);
    display:inline-flex; align-items:center; justify-content:center; font-size:19px;
    padding:0 10px; gap:2px;
    margin-bottom:14px; position:relative; z-index:1;
  }
  .tool-card h2{
    font-family:'Reem Kufi'; font-size:19px; margin:0 0 6px; color:var(--teal-900);
    position:relative; z-index:1;
  }
  .tool-card p{
    margin:0; font-size:13px; color:var(--ink-soft); line-height:1.7;
    position:relative; z-index:1;
  }
  .tool-card .go{
    margin-top:14px; font-size:12.5px; font-weight:700; color:var(--gold);
    position:relative; z-index:1;
  }

  .empty-slot{
    border:1.5px dashed var(--line); border-radius:20px; padding:22px 20px;
    display:flex; align-items:center; justify-content:center;
    color:var(--ink-soft); font-size:13px; text-align:center; min-height:120px;
  }

  footer{ text-align:center; margin-top:40px; color:var(--ink-soft); font-size:12px; }
</style>
</head>
