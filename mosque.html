<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>مصروفات المساجد</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400..700&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet" />
<style>
  :root{
    --teal-900:#0B4F45;
    --teal-800:#0E5D51;
    --teal-700:#136B5D;
    --gold:#C9982E;
    --gold-light:#E7CB84;
    --parchment:#F6F1E4;
    --paper:#FFFDF8;
    --ink:#26221D;
    --ink-soft:#6E6255;
    --red:#B5493D;
    --red-bg:#F7E7E3;
    --green:#4B7A5C;
    --green-bg:#E6EFE6;
    --line: rgba(38,34,29,.12);
    --shadow: 0 10px 30px -12px rgba(11,79,69,.25);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 50% -10%, #ffffff 0%, var(--parchment) 55%),
      var(--parchment);
    color:var(--ink);
    font-family:'Tajawal', sans-serif;
    min-height:100vh;
    padding:20px 14px 60px;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation:none !important; transition:none !important;}
  }

  .wrap{max-width:760px; margin:0 auto;}

  /* ===== شريط زخرفي علوي ===== */
  .braid{
    height:10px;
    margin-bottom:18px;
    background-image:
      linear-gradient(45deg, var(--gold) 25%, transparent 25%),
      linear-gradient(-45deg, var(--gold) 25%, transparent 25%);
    background-size:14px 14px;
    opacity:.55;
    border-radius:6px;
  }

  header.top{
    display:flex; align-items:flex-start; justify-content:space-between;
    margin-bottom:22px;
  }
  header.top h1{
    font-family:'Reem Kufi', sans-serif;
    font-size:30px; margin:0 0 4px;
    color:var(--teal-900);
  }
  header.top p{
    margin:0; color:var(--ink-soft); font-size:14px;
  }
  .gear-btn{
    background:var(--paper); border:1px solid var(--line);
    width:42px; height:42px; border-radius:14px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; box-shadow:var(--shadow); flex-shrink:0;
  }
  .gear-btn svg{width:20px; height:20px; stroke:var(--teal-900);}

  /* ===== بطاقات الملخص بشكل محراب ===== */
  .arches{
    display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;
    margin-bottom:22px;
  }
  .arch{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:70px 70px 14px 14px;
    padding:26px 8px 16px;
    text-align:center;
    box-shadow:var(--shadow);
    position:relative;
  }
  .arch::before{
    content:"";
    position:absolute; top:14px; left:50%; transform:translateX(-50%);
    width:26px; height:26px; border-radius:50%;
    background:var(--gold-light); opacity:.5;
  }
  .arch .num{
    font-family:'Reem Kufi', sans-serif;
    font-size:19px; font-weight:700; position:relative; z-index:1;
  }
  .arch .lbl{font-size:11.5px; color:var(--ink-soft); margin-top:6px;}
  .arch.income .num{color:var(--green);}
  .arch.expense .num{color:var(--red);}
  .arch.remaining{background:var(--teal-900); border-color:var(--teal-900);}
  .arch.remaining .num{color:var(--gold-light); font-size:21px;}
  .arch.remaining .lbl{color:#cfe4de;}
  .arch.remaining::before{background:var(--gold);}

  @media (max-width:480px){
    .arches{grid-template-columns:1fr 1fr 1fr; gap:7px;}
    .arch{padding:20px 4px 12px; border-radius:44px 44px 10px 10px;}
    .arch .num{font-size:14px;}
  }

  /* ===== التبويبات ===== */
  .tabs{
    display:flex; gap:8px; margin-bottom:18px;
    border-bottom:2px solid var(--line); padding-bottom:0;
  }
  .tab-btn{
    flex:1; padding:12px 6px; background:transparent; border:none;
    font-family:'Tajawal'; font-weight:700; font-size:15px;
    color:var(--ink-soft); cursor:pointer; border-radius:10px 10px 0 0;
    position:relative; top:2px;
  }
  .tab-btn.active{
    color:var(--teal-900);
    border-bottom:3px solid var(--gold);
  }

  .panel{display:none;}
  .panel.active{display:block; animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}

  /* ===== نموذج الإضافة ===== */
  .card{
    background:var(--paper); border:1px solid var(--line);
    border-radius:18px; padding:20px; box-shadow:var(--shadow);
  }
  .segmented{
    display:flex; background:var(--parchment); border-radius:12px; padding:4px;
    margin-bottom:18px;
  }
  .segmented button{
    flex:1; padding:11px; border:none; background:transparent;
    font-family:'Tajawal'; font-weight:700; font-size:14.5px;
    border-radius:9px; cursor:pointer; color:var(--ink-soft);
  }
  .segmented button.active.exp{background:var(--red); color:#fff;}
  .segmented button.active.inc{background:var(--green); color:#fff;}

  label{display:block; font-size:13px; color:var(--ink-soft); margin:14px 0 6px; font-weight:700;}
  input, select, textarea{
    width:100%; padding:12px 13px; border-radius:10px;
    border:1px solid var(--line); background:#fff;
    font-family:'Tajawal'; font-size:15px; color:var(--ink);
  }
  input:focus, select:focus, textarea:focus{
    outline:2px solid var(--gold); outline-offset:1px; border-color:var(--gold);
  }
  textarea{resize:vertical; min-height:56px;}

  .save-btn{
    width:100%; margin-top:20px; padding:14px; border:none; border-radius:12px;
    font-family:'Reem Kufi'; font-size:17px; cursor:pointer;
    background:var(--teal-900); color:#fff;
    box-shadow:0 8px 18px -6px rgba(11,79,69,.5);
  }
  .save-btn:disabled{opacity:.6; cursor:default;}
  .save-btn.exp{background:var(--red);}
  .save-btn.inc{background:var(--green);}

  .msg{
    margin-top:12px; padding:10px 12px; border-radius:10px; font-size:13.5px;
    display:none;
  }
  .msg.ok{display:block; background:var(--green-bg); color:var(--green);}
  .msg.err{display:block; background:var(--red-bg); color:var(--red);}

  /* ===== المتابعة ===== */
  .chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:14px;}
  .chip{
    flex-shrink:0; padding:8px 15px; border-radius:20px; border:1px solid var(--line);
    background:var(--paper); font-size:13px; font-weight:700; color:var(--ink-soft);
    cursor:pointer; white-space:nowrap;
  }
  .chip.active{background:var(--teal-900); color:#fff; border-color:var(--teal-900);}

  .searchbox{margin-bottom:14px;}

  .tx{
    display:flex; align-items:center; gap:12px;
    background:var(--paper); border:1px solid var(--line); border-radius:14px;
    padding:13px 14px; margin-bottom:9px;
  }
  .tx .dot{
    width:9px; height:9px; border-radius:50%; flex-shrink:0;
  }
  .tx.income .dot{background:var(--green);}
  .tx.expense .dot{background:var(--red);}
  .tx .body{flex:1; min-width:0;}
  .tx .desc{font-weight:700; font-size:14.5px; margin-bottom:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .tx .meta{font-size:12px; color:var(--ink-soft);}
  .tx .amt{font-family:'Reem Kufi'; font-size:15px; flex-shrink:0;}
  .tx.income .amt{color:var(--green);}
  .tx.expense .amt{color:var(--red);}

  .empty{
    text-align:center; padding:40px 12px; color:var(--ink-soft); font-size:14px;
  }
  .empty b{display:block; color:var(--ink); font-family:'Reem Kufi'; font-size:17px; margin-bottom:6px;}

  /* ===== إعدادات الرابط ===== */
  .overlay{
    position:fixed; inset:0; background:rgba(11,20,17,.55);
    display:none; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .overlay.show{display:flex;}
  .modal{
    background:var(--paper); border-radius:18px; padding:22px; max-width:420px; width:100%;
    box-shadow:0 30px 60px -10px rgba(0,0,0,.4);
  }
  .modal h2{font-family:'Reem Kufi'; color:var(--teal-900); margin:0 0 8px; font-size:19px;}
  .modal p{font-size:13px; color:var(--ink-soft); line-height:1.9; margin:0 0 14px;}
  .modal .actions{display:flex; gap:8px; margin-top:16px;}
  .modal .actions button{
    flex:1; padding:12px; border-radius:10px; border:none; font-family:'Tajawal'; font-weight:700; cursor:pointer;
  }
  .btn-cancel{background:var(--parchment); color:var(--ink);}
  .btn-save{background:var(--teal-900); color:#fff;}

  .loader{
    display:inline-block; width:16px; height:16px; border-radius:50%;
    border:2px solid rgba(255,255,255,.4); border-top-color:#fff;
    animation:spin .7s linear infinite; vertical-align:middle; margin-inline-end:6px;
  }
  @keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div class="wrap">
  <div class="braid"></div>
  <header class="top">
    <div>
      <h1>مصروفات المساجد</h1>
      <p>متابعة أنيقة لموارد المساجد ومصروفاتها، مباشرة من الشيت</p>
    </div>
    <a href="index.html" class="gear-btn" style="text-decoration:none; font-size:18px; line-height:1;" aria-label="الرئيسية" title="الرئيسية">🏠</a>
    <button class="gear-btn" id="settingsBtn" aria-label="إعدادات الاتصال">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 005 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09A1.65 1.65 0 0015 4.6a1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09A1.65 1.65 0 0019.4 15z"></path>
      </svg>
    </button>
  </header>

  <div class="arches">
    <div class="arch income"><div class="num" id="sumIncome">—</div><div class="lbl">إجمالي الوارد</div></div>
    <div class="arch expense"><div class="num" id="sumExpense">—</div><div class="lbl">إجمالي المصروف</div></div>
    <div class="arch remaining"><div class="num" id="sumRemaining">—</div><div class="lbl">المتبقي</div></div>
  </div>

  <div class="tabs">
    <button class="tab-btn active" data-tab="add">إضافة قيد</button>
    <button class="tab-btn" data-tab="track">المتابعة</button>
  </div>

  <!-- ===== إضافة ===== -->
  <div class="panel active" id="panel-add">
    <div class="card">
      <div class="segmented">
        <button type="button" class="active exp" data-type="expense">مصروف 🔴</button>
        <button type="button" class="inc" data-type="income">وارد 🟢</button>
      </div>

      <form id="entryForm">
        <div id="targetField">
          <label for="target">جهة الصرف</label>
          <select id="target" name="target"></select>
        </div>

        <label for="desc">البيان</label>
        <input type="text" id="desc" placeholder="مثال: رواتب أمير الحارس لشهر 9" required />

        <label for="amount">المبلغ</label>
        <input type="number" id="amount" inputmode="decimal" step="0.01" placeholder="0.00" required />

        <label for="date">التاريخ</label>
        <input type="date" id="date" required />

        <label for="notes">ملاحظات (اختياري)</label>
        <textarea id="notes" placeholder="أي تفاصيل إضافية..."></textarea>

        <button type="submit" class="save-btn exp" id="submitBtn">حفظ في الشيت</button>
        <div class="msg" id="formMsg"></div>
      </form>
    </div>
  </div>

  <!-- ===== المتابعة ===== -->
  <div class="panel" id="panel-track">
    <input type="text" class="searchbox" id="search" placeholder="ابحث عن بيان أو جهة..." />
    <div class="chips" id="chips"></div>
    <div id="txList"></div>
  </div>
</div>

<!-- ===== إعدادات ===== -->
<div class="overlay" id="overlay">
  <div class="modal">
    <h2>ربط التطبيق بالشيت</h2>
    <p>
      افتح شيت "مصروفات المساجد" ← الإضافات ← Apps Script، الصق كود <b>Code.gs</b> المرفق،
      ثم Deploy ← Web app (Execute as: Me / Access: Anyone)، وألصق رابط الويب هنا.
    </p>
    <label for="urlInput">رابط Web App</label>
    <input type="text" id="urlInput" placeholder="https://script.google.com/macros/s/.../exec" />
    <div class="actions">
      <button class="btn-cancel" id="cancelBtn">إلغاء</button>
      <button class="btn-save" id="saveUrlBtn">حفظ واتصال</button>
    </div>
  </div>
</div>

<script>
// ===== رابط الـ Web App الثابت =====
// هذا هو المكان الوحيد اللي تحتاج تعدّله مستقبلاً لو غيّرت رابط النشر
// (مثلاً لو سويت Deploy جديد كلياً بدل تعديل نفس النشر الحالي)
const DEFAULT_WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzBjYdhDTlUQTNnwmPMFah0KR57fCPpNfIRcpSdtp9WBZ4h3IZNiLluCxevlGwZ5yzpPg/exec';

let webAppUrl = DEFAULT_WEB_APP_URL;
let cache = { income: [], expenses: [], totals: {income:0, expense:0, remaining:0}, targets: [] };
let activeType = 'expense';
let activeChip = 'الكل';

const fmt = n => (Number(n)||0).toLocaleString('ar-SA', {maximumFractionDigits:2});

// ---------- تخزين رابط الويب (localStorage كخيار تجاوز يدوي فقط) ----------
async function loadUrl(){
  try{
    const v = localStorage.getItem('mosque-expenses:webapp-url');
    if(v) webAppUrl = v; // تجاوز يدوي إذا غيّره المستخدم من الإعدادات سابقاً
  }catch(e){ /* نبقى على الرابط الثابت DEFAULT_WEB_APP_URL */ }
}
async function saveUrl(u){
  webAppUrl = u;
  try{ localStorage.setItem('mosque-expenses:webapp-url', u); }catch(e){}
}

// ---------- عناصر ----------
const overlay = document.getElementById('overlay');
document.getElementById('settingsBtn').onclick = () => {
  document.getElementById('urlInput').value = webAppUrl;
  overlay.classList.add('show');
};
document.getElementById('cancelBtn').onclick = () => overlay.classList.remove('show');
document.getElementById('saveUrlBtn').onclick = async () => {
  const v = document.getElementById('urlInput').value.trim();
  if(!v) return;
  await saveUrl(v);
  overlay.classList.remove('show');
  fetchData();
};

// تبويبات علوية
document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.onclick = () => {
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('panel-'+btn.dataset.tab).classList.add('active');
    if(btn.dataset.tab==='track') renderList();
  };
});

// تبديل مصروف/وارد
document.querySelectorAll('.segmented button').forEach(btn=>{
  btn.onclick = () => {
    activeType = btn.dataset.type;
    document.querySelectorAll('.segmented button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    const targetField = document.getElementById('targetField');
    const submitBtn = document.getElementById('submitBtn');
    if(activeType==='expense'){
      targetField.style.display='block';
      submitBtn.className = 'save-btn exp';
    } else {
      targetField.style.display='none';
      submitBtn.className = 'save-btn inc';
    }
  };
});

// تاريخ اليوم افتراضي (بصيغة yyyy-mm-dd لحقل input date)
document.getElementById('date').valueAsDate = new Date();

// ---------- جلب البيانات ----------
async function fetchData(){
  if(!webAppUrl){
    document.getElementById('sumIncome').textContent = 'اربط الشيت';
    document.getElementById('sumExpense').textContent = 'من الإعدادات';
    document.getElementById('sumRemaining').textContent = '⚙️';
    return;
  }
  try{
    const res = await fetch(webAppUrl);
    const data = await res.json();
    if(data.error) throw new Error(data.error);
    cache = data;
    renderSummary();
    renderTargets();
    renderChips();
    renderList();
  }catch(err){
    document.getElementById('sumIncome').textContent = 'تعذر الاتصال';
    document.getElementById('sumExpense').textContent = '—';
    document.getElementById('sumRemaining').textContent = '—';
  }
}

function renderSummary(){
  document.getElementById('sumIncome').textContent = fmt(cache.totals.income);
  document.getElementById('sumExpense').textContent = fmt(cache.totals.expense);
  document.getElementById('sumRemaining').textContent = fmt(cache.totals.remaining);
}

function renderTargets(){
  const sel = document.getElementById('target');
  sel.innerHTML = '';
  (cache.targets||[]).forEach(t=>{
    const opt = document.createElement('option');
    opt.value = t; opt.textContent = t;
    sel.appendChild(opt);
  });
}

function renderChips(){
  const wrap = document.getElementById('chips');
  const list = ['الكل', ...(cache.targets||[])];
  wrap.innerHTML = '';
  list.forEach(t=>{
    const c = document.createElement('button');
    c.className = 'chip' + (t===activeChip ? ' active':'');
    c.textContent = t;
    c.onclick = () => { activeChip = t; renderChips(); renderList(); };
    wrap.appendChild(c);
  });
}

function parseDMY(d){
  const p = String(d).split(/[-\/]/);
  if(p.length===3) return new Date(p[2].length===4? p[2]+'-'+p[1]+'-'+p[0] : d);
  return new Date(d);
}

function renderList(){
  const q = (document.getElementById('search').value||'').trim();
  let items = [
    ...cache.expenses.map(e=>({...e, type:'expense'})),
    ...cache.income.map(i=>({...i, type:'income', target:''}))
  ];
  if(activeChip !== 'الكل'){
    items = items.filter(i => i.type==='income' ? false : i.target===activeChip);
    if(activeChip==='الكل') items = items;
  }
  if(q){
    const ql = q.toLowerCase();
    items = items.filter(i =>
      (i.desc||'').toLowerCase().includes(ql) ||
      (i.target||'').toLowerCase().includes(ql) ||
      (i.notes||'').toLowerCase().includes(ql)
    );
  }
  items.sort((a,b)=> parseDMY(b.date) - parseDMY(a.date));

  const wrap = document.getElementById('txList');
  wrap.innerHTML = '';
  if(!items.length){
    wrap.innerHTML = '<div class="empty"><b>لا توجد قيود بعد</b>ابدأ بإضافة أول مصروف أو وارد من تبويب "إضافة قيد"</div>';
    return;
  }
  items.forEach(i=>{
    const row = document.createElement('div');
    row.className = 'tx ' + i.type;
    row.innerHTML = `
      <span class="dot"></span>
      <div class="body">
        <div class="desc">${escapeHtml(i.desc||'—')}</div>
        <div class="meta">${i.type==='expense' ? escapeHtml(i.target||'') + ' · ' : ''}${escapeHtml(i.date||'')}</div>
      </div>
      <div class="amt">${i.type==='expense'?'-':'+'}${fmt(i.amount)}</div>
    `;
    wrap.appendChild(row);
  });
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

document.getElementById('search').addEventListener('input', renderList);

// ---------- حفظ قيد جديد ----------
document.getElementById('entryForm').addEventListener('submit', async (e)=>{
  e.preventDefault();
  if(!webAppUrl){
    document.getElementById('settingsBtn').click();
    return;
  }
  const submitBtn = document.getElementById('submitBtn');
  const msg = document.getElementById('formMsg');
  msg.className = 'msg';

  const dateVal = document.getElementById('date').value; // yyyy-mm-dd
  const [y,m,d] = dateVal.split('-');
  const dateStr = `${d}-${m}-${y}`;

  const payload = {
    action: activeType==='expense' ? 'addExpense' : 'addIncome',
    desc: document.getElementById('desc').value,
    amount: document.getElementById('amount').value,
    date: dateStr,
    notes: document.getElementById('notes').value,
  };
  if(activeType==='expense'){
    payload.target = document.getElementById('target').value;
  }

  submitBtn.disabled = true;
  submitBtn.innerHTML = '<span class="loader"></span> جارٍ الحفظ...';

  try{
    // نستخدم no-cors لأن استجابة POST عبر رابط إعادة توجيه Apps Script
    // لا تحمل ترويسات CORS بشكل ثابت؛ الاستجابة هنا "معتمة" فلا يمكن قراءتها،
    // لذا نتحقق من نجاح الحفظ عبر إعادة جلب البيانات (GET) بعد الإرسال مباشرة
    await fetch(webAppUrl, {
      method:'POST',
      mode:'no-cors',
      headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });

    const before = cache.income.length + cache.expenses.length;
    await fetchData();
    const after = cache.income.length + cache.expenses.length;

    if(after > before){
      msg.textContent = 'تم الحفظ في الشيت بنجاح ✅';
      msg.className = 'msg ok';
      document.getElementById('entryForm').reset();
      document.getElementById('date').valueAsDate = new Date();
    } else {
      msg.textContent = 'لم يتأكد الحفظ — تحقق من الشيت أو من رابط الويب في الإعدادات';
      msg.className = 'msg err';
    }
  }catch(err){
    msg.textContent = 'تعذر الحفظ، تأكد من رابط الويب في الإعدادات';
    msg.className = 'msg err';
  }finally{
    submitBtn.disabled = false;
    submitBtn.innerHTML = 'حفظ في الشيت';
  }
});

// ---------- بدء التشغيل ----------
(async function init(){
  await loadUrl();
  fetchData();
})();
</script>

</html>
